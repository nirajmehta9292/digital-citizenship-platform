version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: byt-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: byt_education
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - byt-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: byt-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=byt_education
      - SECRET_KEY=change-this-in-production-to-secure-secret-key
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - byt-network
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: byt-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - byt-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  byt-network:
    driver: bridge
